<body>
    <div class="locked"><i class="fa-solid fa-lock"><b><i><h3 class="locks">Locked</h3></i></b></i></div>
    <h3 class="pin-text"><b><i>PIN</i></b></h3>
    <div class="pin">
    <button onclick="pressKey('1')"><b>1</b></button>
    <button onclick="pressKey('2')"><b>2</b></button>

    <button onclick="pressKey('0')"><b>0</b></button>

    </div>
    <div class="pinShow">
     <input type="text" id="pinShow" placeholder="Enter Game Pin">
     </div>
     <button class="enter" onclick="checkPin()"><b><i>Enter</i></b></button>
